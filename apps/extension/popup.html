<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bidlot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 300px;
      padding: 20px;
      background: #0f0e0d;
      color: #cdccca;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #f5c842;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .logo span { color: #cdccca; }
    .tagline {
      font-size: 11px;
      color: #6b6966;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-box {
      background: #1a1917;
      border: 1px solid #2a2826;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #8b8986;
      min-height: 40px;
    }
    .status-box.success { border-color: #2d5a27; color: #6bcf5e; }
    .status-box.error { border-color: #5a2727; color: #cf5e5e; }
    .status-box.loading { color: #f5c842; }
    button {
      width: 100%;
      padding: 11px 16px;
      background: #f5c842;
      color: #0f0e0d;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #3a3836;
      text-align: center;
    }
    .last-import {
      font-size: 11px;
      color: #4a4846;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">bid<span>lot</span></div>
  <div class="tagline">Auction Intelligence OS</div>

  <div class="status-box" id="status">
    Ready to import your CTBids watchlist.
  </div>

  <button id="importBtn">Import Watchlist</button>

  <div class="last-import" id="lastImport"></div>

  <div class="footer">bidlot — navigate to ctbids.com/watching first</div>

  <script src="popup.js"></script>
</body>
</html>
